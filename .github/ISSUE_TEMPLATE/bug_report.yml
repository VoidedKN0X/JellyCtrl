name: Bug report
description: Something in JellyCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you post, please remove your server address, passwords, API keys and any personal information from the text and screenshots below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: app-version
    attributes:
      label: JellyCtrl version
      placeholder: "Profile picture, bottom of the page, e.g. 0.5.6"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Jellyfin version
      placeholder: "e.g. 10.10.7 (Server dashboard in JellyCtrl, or Dashboard in Jellyfin's web page)"
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag screenshots here, or paste error messages. Please check them for private details first.
